name: Build Android APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Environment & Keystore
        run: |
          # Create .env from template if not present
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

          # Restore debug.keystore from base64 or generate default key
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure Gradle wrapper script is executable
          chmod +x gradlew

      - name: Build APK (Debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Build AAB (App Bundle)
        run: |
          ./gradlew bundleDebug --stacktrace
          # Attempt release bundle if keystore available
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Alangmotor-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload AAB (Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: Alangmotor-AAB
          path: app/build/outputs/bundle/**/*.aab
          retention-days: 14
